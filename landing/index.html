<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Damocles — Cited intelligence, at the speed of the threat.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --panel-bg: #0b0f17;
    --panel-surface: #111827;
    --panel-border: #1c2433;
    --panel-text: #e2e8f0;
    --panel-muted: #94a3b8;
    --threat-amber: #f59e0b;
    --threat-amber-dim: rgba(245, 158, 11, 0.4);
    --threat-red: #ef4444;
    --audit-emerald: #10b981;
    --data-cyan: #22d3ee;
    --linguist-fuchsia: #e879f9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--panel-bg); color: var(--panel-text); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .font-serif { font-family: 'Newsreader', Georgia, serif; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

  /* Selection */
  ::selection { background: var(--threat-amber); color: #0b0f17; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0b0f17; }
  ::-webkit-scrollbar-thumb { background: #1c2433; border-radius: 4px; }

  /* Section label */
  .section-label {
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 11px;
    color: var(--panel-muted);
  }

  /* Hairline */
  .hairline {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--panel-border) 20%, var(--panel-border) 80%, transparent);
  }

  /* Pulse keyframes for map markers */
  @keyframes mapPulse {
    0%   { transform: scale(0.4); opacity: 0.9; }
    100% { transform: scale(3.5); opacity: 0; }
  }
  .pulse-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid var(--threat-amber);
    animation: mapPulse 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
  }
  .pulse-ring.delay-1 { animation-delay: 0.8s; }
  .pulse-ring.delay-2 { animation-delay: 1.6s; }

  @keyframes dashMove {
    to { stroke-dashoffset: -24; }
  }
  .dash-flow { animation: dashMove 1.6s linear infinite; }

  @keyframes chevronBounce {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50%      { transform: translateY(8px); opacity: 1; }
  }
  .chevron-bounce { animation: chevronBounce 2s ease-in-out infinite; }

  @keyframes vesselPulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }

  @keyframes graphWiggle {
    0%, 100% { transform: translate(0,0); }
    25% { transform: translate(2px, -1.5px); }
    50% { transform: translate(-1px, 2px); }
    75% { transform: translate(1.5px, 0.5px); }
  }
  .graph-node-wiggle { animation: graphWiggle 3.6s ease-in-out infinite; }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 700ms cubic-bezier(0.2,0.7,0.2,1), transform 700ms cubic-bezier(0.2,0.7,0.2,1); }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .reveal-stagger > * { opacity: 0; transform: translateY(16px); transition: opacity 600ms ease, transform 600ms ease; }
  .reveal-stagger.visible > * { opacity: 1; transform: translateY(0); }
  .reveal-stagger.visible > *:nth-child(1) { transition-delay: 0ms; }
  .reveal-stagger.visible > *:nth-child(2) { transition-delay: 80ms; }
  .reveal-stagger.visible > *:nth-child(3) { transition-delay: 160ms; }
  .reveal-stagger.visible > *:nth-child(4) { transition-delay: 240ms; }
  .reveal-stagger.visible > *:nth-child(5) { transition-delay: 320ms; }
  .reveal-stagger.visible > *:nth-child(6) { transition-delay: 400ms; }
  .reveal-stagger.visible > *:nth-child(7) { transition-delay: 480ms; }
  .reveal-stagger.visible > *:nth-child(8) { transition-delay: 560ms; }

  /* Magnetic CTA — base styles, JS adds translate */
  .cta-amber {
    background: var(--threat-amber);
    color: #0b0f17;
    padding: 14px 22px;
    border-radius: 2px;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    border: 1px solid var(--threat-amber);
    cursor: pointer;
    transition: box-shadow 240ms ease, transform 200ms cubic-bezier(0.2,0.7,0.2,1);
    position: relative;
    will-change: transform;
  }
  .cta-amber:hover {
    box-shadow: 0 0 32px -4px rgba(245, 158, 11, 0.5), 0 0 0 1px rgba(245,158,11,0.6) inset;
  }
  .cta-ghost {
    background: transparent;
    color: var(--panel-text);
    padding: 14px 22px;
    border-radius: 2px;
    font-weight: 500;
    font-size: 14px;
    border: 1px solid var(--panel-border);
    cursor: pointer;
    transition: border-color 240ms ease, background 240ms ease, transform 200ms cubic-bezier(0.2,0.7,0.2,1);
    will-change: transform;
  }
  .cta-ghost:hover {
    border-color: var(--panel-muted);
    background: rgba(255,255,255,0.02);
  }

  /* Cards */
  .panel-card {
    background: var(--panel-surface);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    transition: border-color 240ms ease, box-shadow 240ms ease, transform 240ms ease;
  }
  .panel-card:hover {
    border-color: rgba(245, 158, 11, 0.45);
    box-shadow: 0 0 32px -8px rgba(245, 158, 11, 0.4);
  }

  /* The amber rotated square monogram */
  .monogram {
    width: 14px;
    height: 14px;
    background: var(--threat-amber);
    transform: rotate(45deg);
    box-shadow: 0 0 14px rgba(245, 158, 11, 0.6);
  }
  .monogram-thread {
    width: 1px;
    height: 14px;
    background: linear-gradient(180deg, transparent, rgba(245, 158, 11, 0.5));
    margin: 0 auto;
  }

  /* Underline draw */
  .amber-underline {
    background-image: linear-gradient(var(--threat-amber), var(--threat-amber));
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 0% 2px;
    transition: background-size 800ms cubic-bezier(0.2,0.7,0.2,1);
    padding-bottom: 2px;
  }
  .amber-underline.drawn { background-size: 100% 2px; }

  /* Headline letter-reveal (per word) */
  .word-reveal { display: inline-block; opacity: 0; transform: translateY(20px); filter: blur(4px); transition: opacity 700ms ease, transform 700ms cubic-bezier(0.2,0.7,0.2,1), filter 700ms ease; }
  .word-reveal.in { opacity: 1; transform: translateY(0); filter: blur(0); }

  /* Anchor offset */
  section[id] { scroll-margin-top: 24px; }

  /* Hero text shadow for readability */
  .hero-shadow { text-shadow: 0 2px 24px rgba(0,0,0,0.6); }

  /* Footer sigma */
  .sigma-glyph {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-size: 28px;
    color: var(--threat-amber);
  }

  /* Map pulse circle (CSS for hero non-WebGL fallback markers, but we draw on canvas) */

  /* Scroll progress bar */
  .scroll-progress {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: var(--threat-amber);
    z-index: 100;
    width: 0%;
    transition: width 60ms linear;
  }

  /* Topbar */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(11,15,23,0.85), rgba(11,15,23,0));
    backdrop-filter: blur(2px);
  }
  .topbar a { color: var(--panel-muted); text-decoration: none; font-size: 13px; font-family: 'JetBrains Mono', monospace; transition: color 200ms ease; }
  .topbar a:hover { color: var(--panel-text); }

  .version-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--panel-muted);
    border: 1px solid var(--panel-border);
    padding: 2px 6px;
    border-radius: 2px;
    margin-left: 10px;
    letter-spacing: 0.04em;
  }

  /* Container */
  .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* Sections breathing room */
  section.page-section { padding: 140px 0; position: relative; }

  /* Numbers strip number style */
  .big-number {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: clamp(48px, 7vw, 96px);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  /* link list */
  .inline-link {
    color: var(--panel-muted);
    text-decoration: none;
    border-bottom: 1px dotted var(--panel-border);
    padding-bottom: 1px;
    transition: color 200ms ease, border-color 200ms ease;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .inline-link:hover { color: var(--threat-amber); border-color: var(--threat-amber); }

  /* SAR tile pseudo-render */
  .sar-tile {
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    background:
      radial-gradient(circle at 30% 40%, rgba(245,158,11,0.18), transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(34,211,238,0.08), transparent 50%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px),
      #07090e;
  }
  .sar-tile::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,0.4), transparent 50%),
      radial-gradient(1px 1px at 33% 75%, rgba(255,255,255,0.3), transparent 50%),
      radial-gradient(1px 1px at 65% 18%, rgba(255,255,255,0.35), transparent 50%),
      radial-gradient(1px 1px at 80% 55%, rgba(255,255,255,0.25), transparent 50%),
      radial-gradient(1px 1px at 47% 47%, rgba(255,255,255,0.5), transparent 50%);
    mix-blend-mode: screen;
  }

  /* Greece silhouette pulsing */
  @keyframes greecePulse {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(245,158,11,0.4)); }
    50%      { filter: drop-shadow(0 0 14px rgba(245,158,11,0.8)); }
  }
  .greece-pulse { animation: greecePulse 3.4s ease-in-out infinite; }

  /* Polygon morph */
  @keyframes polyMorph {
    0%   { d: path('M 30,60 L 50,30 L 80,40 L 90,70 L 60,85 Z'); }
    50%  { d: path('M 25,55 L 55,25 L 85,45 L 88,75 L 50,90 Z'); }
    100% { d: path('M 30,60 L 50,30 L 80,40 L 90,70 L 60,85 Z'); }
  }

  /* Cursor draw cursor */
  @keyframes drawCursor {
    0%   { transform: translate(15px, 80px); }
    25%  { transform: translate(70px, 25px); }
    50%  { transform: translate(95px, 60px); }
    75%  { transform: translate(60px, 90px); }
    100% { transform: translate(15px, 80px); }
  }
  .draw-cursor { animation: drawCursor 5s ease-in-out infinite; }

  /* Hash chain */
  .hash-block {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: var(--audit-emerald);
    padding: 4px 6px;
    border-radius: 2px;
    letter-spacing: 0.04em;
  }
  @keyframes hashAppear {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Architecture moving dash */
  .arch-line { stroke-dasharray: 4 6; animation: dashMove 1.6s linear infinite; }

  /* Demo timeline rows */
  .demo-row { transition: background 240ms ease; }
  .demo-row:hover { background: rgba(245, 158, 11, 0.04); }

  /* For mobile */
  @media (max-width: 768px) {
    .hide-mobile { display: none !important; }
    .topbar { padding: 14px 18px; }
    section.page-section { padding: 80px 0; }
  }

  /* Cursor parallax wrapper */
  .parallax-wrap { will-change: transform; transition: transform 200ms ease-out; }

  /* citation chain map dot */
  @keyframes citePulse {
    0%   { transform: scale(0); opacity: 0; }
    20%  { transform: scale(1); opacity: 1; }
    100% { transform: scale(3.5); opacity: 0; }
  }

  /* graph node light up */
  @keyframes nodeLight {
    0%   { fill: #1c2433; }
    100% { fill: var(--threat-amber); }
  }

  /* layer parallax cards */
  .layer-card {
    position: absolute;
    border: 1px solid var(--panel-border);
    background: rgba(17, 24, 39, 0.85);
    border-radius: 2px;
    transition: transform 360ms cubic-bezier(0.2,0.7,0.2,1);
  }
  .layer-stack:hover .layer-card.l1 { transform: translate(-8px, -8px); }
  .layer-stack:hover .layer-card.l2 { transform: translate(0, 0); }
  .layer-stack:hover .layer-card.l3 { transform: translate(8px, 8px); }
</style>
</head>
<body>
  <div id="scrollProgress" class="scroll-progress"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Real Greek sovereign-territory geometry (must load before hero/sections) -->
  <script src="src/geo-greece.js"></script>

  <script type="text/babel" src="src/lib.jsx"></script>
  <script type="text/babel" src="src/i18n.jsx"></script>
  <script type="text/babel" src="src/greece-svg.jsx"></script>
  <script type="text/babel" src="src/hero.jsx"></script>
  <script type="text/babel" src="src/sections-a.jsx"></script>
  <script type="text/babel" src="src/sections-b.jsx"></script>
  <script type="text/babel" src="src/sections-c.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>

  <script>
    // Scroll progress
    const bar = document.getElementById('scrollProgress');
    window.addEventListener('scroll', () => {
      const h = document.documentElement;
      const pct = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100;
      bar.style.width = pct + '%';
    }, { passive: true });
  </script>
</body>
</html>
