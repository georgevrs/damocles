[project]
name = "damocles"
version = "0.1.0"
description = "Sovereign Intelligence Analysis Platform — EYP National Security Innovation Challenge 2026"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "websockets==13.0",

    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",

    # Graph database
    "neo4j==5.24.0",

    # Geospatial
    "sentinelhub>=3.10",
    "rasterio==1.3.10",
    "shapely==2.0.6",
    "pyproj==3.6.1",
    "numpy==1.26.4",
    "scipy==1.14.1",
    "opencv-python==4.10.0.84",

    # OSINT
    # GDELT: we fetch the public masterfilelist CSV directly via httpx — see plan §3a.
    # The PyPI `gdelt` wrapper has malformed metadata on 0.1.10, so we skip it.
    "telethon==1.36.0",
    # opensky-api wraps a simple REST endpoint; we hit it directly via httpx where needed.

    # NLP
    "spacy==3.7.6",
    "langdetect==1.0.9",

    # LLM providers — selected at runtime via LLM_PROVIDER env var
    # google-genai is the new SDK (supports Gemini 3, thinking_level, etc.).
    # google-generativeai stays for langchain-google-genai which still depends on it.
    "google-genai>=1.20.0",   # 1.20+ exposes ThinkingConfig.thinking_budget / thinking_level for Gemini 2.5/3
    "google-generativeai==0.8.3",
    "ollama>=0.4.0",   # 0.3.x pinned httpx<0.28 which conflicts with new google-genai

    # Agent orchestration
    "langchain>=0.3.1",
    "langchain-google-genai>=2.0.4",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.1",

    # In-memory graph for fusion
    "networkx==3.3",

    # Phase 2 — persistence layer + AoI inference + scheduling
    "duckdb>=1.1.0",            # embedded columnar store + spatial extension (DuckDB-Spatial)
    "apscheduler>=3.10.4",      # async scheduler for the daily Greece-wide scan
    "hdbscan>=0.8.40",          # density-based clustering for AoI inference
    "alphashape>=1.3.1",        # alpha-shapes (archipelago-friendly polygon hulls)
    "h3>=4.1.0",                # H3 hex bucketing for the news-density heatmap layer

    # Async I/O
    "httpx>=0.28.1",
    "aiofiles==24.1.0",
    "aiohttp==3.10.5",

    # Utilities
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "rich==13.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.8",
    "mypy==1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# Resolve only for our actual deployment targets: Windows dev machine + Linux GCP.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "playwright>=1.59.0",
]
